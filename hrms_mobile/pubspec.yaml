name: hrms_mobile
description: "Enterprise HRMS Mobile Application for Android and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3+1
  go_router: ^14.1.4
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  camera: ^0.11.0+1
  intl: ^0.19.0
  lucide_icons: 0.257.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
